
name: Bug report
description: Report a reproducible Mugen Heartbeat problem
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping test Mugen Heartbeat. For BLE, reconnect, loading or rendering problems, an OBS log is especially useful.

  - type: input
    id: plugin-version
    attributes:
      label: Mugen Heartbeat version
      placeholder: e.g. 0.1.37
    validations:
      required: true

  - type: input
    id: obs-version
    attributes:
      label: OBS Studio version
    validations:
      required: true

  - type: input
    id: windows-version
    attributes:
      label: Windows version
      placeholder: e.g. Windows 11 24H2
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Heart-rate device
      placeholder: e.g. Xiaomi Smart Band 10
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Describe the shortest reliable way to reproduce the problem.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: OBS log / additional details
      description: Attach or paste the relevant log section. Remove unrelated private information.
    validations:
      required: false
